[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "qti-unified"
version = "0.2.0"
description = "Standalone patho QTI synthetic generation, GT, inference, and plotting workflow"
requires-python = ">=3.10"
dependencies = [
  "dipy>=1.11",
  "matplotlib>=3.7",
  "nibabel>=5.1",
  "numpy>=1.24",
  "pandas>=2.0",
  "plotly>=5.0",
  "scipy>=1.10",
  "torch>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
qti-unified = "qti_unified.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
utils = ["*.txt"]
